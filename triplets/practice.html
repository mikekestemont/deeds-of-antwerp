<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice — The Little Hands of Antwerp</title>
<link rel="icon" href="../favicon.ico">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* Gallery area */
  .gallery-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #eae5da; }

  .gallery-bar {
    flex-shrink: 0; background: #fdfaf4;
    border-bottom: 1px solid #d6ccb8;
    padding: 6px 16px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px;
  }
  .set-id {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: #6b4c2a;
    background: rgba(107,76,42,0.08); padding: 2px 8px; border-radius: 3px;
  }
  .gallery-nav { display: flex; align-items: center; }
  .gallery-nav button {
    width: 36px; height: 28px; border: 1px solid #d6ccb8;
    background: #fdfaf4; color: #2c2418; cursor: pointer;
    font-size: 15px; display: flex; align-items: center; justify-content: center;
  }
  .gallery-nav button:first-child { border-radius: 4px 0 0 4px; }
  .gallery-nav button:last-child { border-radius: 0 4px 4px 0; }
  .gallery-nav button:disabled { background: #eae5da; color: #d6ccb8; cursor: default; }
  .gallery-counter {
    height: 28px; padding: 0 14px;
    border: 1px solid #d6ccb8; border-left: none; border-right: none;
    background: #fdfaf4; display: flex; align-items: center;
    font-size: 12px; font-weight: 600; font-family: 'Consolas', monospace;
    min-width: 60px; justify-content: center;
  }
  .gallery-hint { font-size: 10px; color: #8a7e6e; font-style: italic; }

  .gallery-progress { height: 2px; background: #d6ccb8; flex-shrink: 0; }
  .gallery-progress-fill { height: 100%; background: #6b4c2a; transition: width 0.3s ease; }

  .panels { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .panel { display: flex; flex-direction: column; min-width: 80px; overflow: hidden; }
  .divider {
    width: 8px; flex-shrink: 0; cursor: col-resize;
    background: #d6ccb8; position: relative; transition: background 0.15s;
  }
  .divider:hover, .divider.active { background: #6b4c2a; }
  .divider::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 32px; border-radius: 1px;
    background: rgba(255,255,255,0.5);
  }
  .panel-header {
    padding: 5px 10px; border-bottom: 1px solid #d6ccb8;
    display: flex; align-items: center; justify-content: space-between;
    background: #fdfaf4; flex-shrink: 0;
  }
  .panel-label { font-size: 16px; font-weight: 700; color: #6b4c2a; }
  .panel-code { font-size: 10px; color: #8a7e6e; font-family: 'Consolas', monospace; margin-left: 6px; }
  .zoom-controls { display: flex; gap: 3px; }
  .zoom-btn {
    width: 26px; height: 26px; border: 1px solid #d6ccb8;
    background: #fdfaf4; color: #6b4c2a; cursor: pointer;
    font-size: 14px; font-weight: 700; border-radius: 3px;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .zoom-btn:hover { background: #eae5da; }
  .viewport {
    flex: 1; overflow: hidden; position: relative;
    cursor: grab; background: #eae5da;
  }
  .viewport.dragging { cursor: grabbing; }
  .viewport img {
    position: absolute; top: 0; left: 0;
    user-select: none; pointer-events: none; -webkit-user-drag: none;
  }
  .zoom-indicator {
    position: absolute; bottom: 6px; right: 6px;
    background: rgba(253,250,244,0.85); padding: 2px 6px;
    border-radius: 3px; font-size: 10px; font-family: 'Consolas', monospace;
    color: #8a7e6e; pointer-events: none;
  }
  .img-error {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #8a7e6e; font-size: 13px; font-style: italic; text-align: center;
  }

  footer { flex-shrink: 0; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="sticky-top navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="../">
      <img alt="logo" src="../files/logo.png" style="height: 64px; width: 64px; margin-right: 10px;">The Little Hands of Antwerp (ca. 1300-1350)
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#basic-navbar-nav" aria-controls="basic-navbar-nav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="basic-navbar-nav">
      <div class="navbar-nav me-auto">

        <a class="nav-link" href="../page/">Atlas</a>
        <a class="nav-link" href="./">Annotation</a>
      </div>

  </div>
</nav>

<!-- Gallery -->
<div class="gallery-wrap">
  <div class="gallery-bar">
    <span class="set-id" id="setId">PRACTICE</span>
    <div class="gallery-nav">
      <button id="prevBtn" onclick="goPrev()">&#8249;</button>
      <div class="gallery-counter" id="counter">1 / 3</div>
      <button id="nextBtn" onclick="goNext()">&#8250;</button>
    </div>
    <span class="gallery-hint">&larr; &rarr; navigate &middot; scroll to zoom &middot; drag to pan</span>
  </div>
  <div class="gallery-progress"><div class="gallery-progress-fill" id="progressFill"></div></div>
  <div class="panels" id="panels"></div>
</div>

<!-- Footer -->
<footer class="bg-light border-top">
  <div class="container">
    <div class="row align-items-center">
      <div class="col m-3">
        <a href="https://github.com/eXtant-CMG/Necturus-Viewer-Compact" target="_blank" class="text-muted text-decoration-none">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 496 512"><path d="M165.9 397.4c0 2-2.3 3.6-5.2 3.6-3.3.3-5.6-1.3-5.6-3.6 0-2 2.3-3.6 5.2-3.6 3-.3 5.6 1.3 5.6 3.6zm-31.1-4.5c-.7 2 1.3 4.3 4.3 4.9 2.6 1 5.6 0 6.2-2s-1.3-4.3-4.3-5.2c-2.6-.7-5.5.3-6.2 2.3zm44.2-1.7c-2.9.7-4.9 2.6-4.6 4.9.3 2 2.9 3.3 5.9 2.6 2.9-.7 4.9-2.6 4.6-4.6-.3-1.9-3-3.2-5.9-2.9zM244.8 8C106.1 8 0 113.3 0 252c0 110.9 69.8 205.8 169.5 239.2 12.8 2.3 17.3-5.6 17.3-12.1 0-6.2-.3-40.4-.3-61.4 0 0-70 15-84.7-29.8 0 0-11.4-29.1-27.8-36.6 0 0-22.9-15.7 1.6-15.4 0 0 24.9 2 38.6 25.8 21.9 38.6 58.6 27.5 72.9 20.9 2.3-16 8.8-27.1 16-33.7-55.9-6.2-112.3-14.3-112.3-110.5 0-27.5 7.6-41.3 23.6-58.9-2.6-6.5-11.1-33.3 2.6-67.9 20.9-6.5 69 27 69 27 20-5.6 41.5-8.5 62.8-8.5s42.8 2.9 62.8 8.5c0 0 48.1-33.6 69-27 13.7 34.7 5.2 61.4 2.6 67.9 16 17.7 25.8 31.5 25.8 58.9 0 96.5-58.9 104.2-114.8 110.5 9.2 7.9 17 22.9 17 46.4 0 33.7-.3 75.4-.3 83.6 0 6.5 4.6 14.4 17.3 12.1C428.2 457.8 496 362.9 496 252 496 113.3 383.5 8 244.8 8zM97.2 352.9c-1.3 1-1 3.3.7 5.2 1.6 1.6 3.9 2.3 5.2 1 1.3-1 1-3.3-.7-5.2-1.6-1.6-3.9-2.3-5.2-1zm-10.8-8.1c-.7 1.3.3 2.9 2.3 3.9 1.6 1 3.6.7 4.3-.7.7-1.3-.3-2.9-2.3-3.9-2-.6-3.6-.3-4.3.7zm32.4 35.6c-1.6 1.3-1 4.3 1.3 6.2 2.3 2.3 5.2 2.6 6.5 1 1.3-1.3.7-4.3-1.3-6.2-2.2-2.3-5.2-2.6-6.5-1zm-11.4-14.7c-1.6 1-1.6 3.6 0 5.9 1.6 2.3 4.3 3.3 5.6 2.3 1.6-1.3 1.6-3.9 0-6.2-1.4-2.3-4-3.3-5.6-2z"></path></svg>
          <span class="ms-2">View source</span>
        </a>
      </div>
      <div class="col-auto m-3 text-end">
        <img src="../logos/logo_fwo.png" alt="FWO" style="height:40px; margin-right:12px;">
        <img src="../logos/logo_ua.jpg" alt="UA" style="height:40px;">
      </div>
      <div class="col m-3 text-end" style="font-size: 10px;">
        <div>Created by University of Antwerp</div>
        <div>Powered by <a class="text-muted text-decoration-none" href="https://github.com/eXtant-CMG/Necturus-Viewer-Compact" target="_blank">Necturus Compact</a></div>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ════════════════════════════════════════════════════════════════════
// TRIPLET DATA — edit this array to change the gallery contents
// ════════════════════════════════════════════════════════════════════
var BASE_URL = "https://storage.googleapis.com/annotation-pilot/images";

var TRIPLETS = [
  {
    a: { file: "0-0001_01_01_1332-01.png", code: "0001_01_01_1332-01" },
    b: { file: "0-0007_01_03_1331-01.png", code: "0007_01_03_1331-01" },
    c: { file: "0-0014_01_07_1349-01.png", code: "0014_01_07_1349-01" },
  },
  {
    a: { file: "0-0003_01_01_1346-01.png", code: "0003_01_01_1346-01" },
    b: { file: "0-0010_01_03_1354-01.png", code: "0010_01_03_1354-01" },
    c: { file: "0-0005_01_02_1341-01.png", code: "0005_01_02_1341-01" },
  },
  {
    a: { file: "0-0012_01_05_1302-01.png", code: "0012_01_05_1302-01" },
    b: { file: "0-0016_01_08_1324-01.png", code: "0016_01_08_1324-01" },
    c: { file: "0-0002_01_01_1335-01.png", code: "0002_01_01_1335-01" },
  },
];

var SET_ID = "PRACTICE";
// ════════════════════════════════════════════════════════════════════

var currentIndex = 0;
var panelState = {};
var panelWidths = [1/3, 1/3, 1/3];

document.getElementById("setId").textContent = SET_ID;

function createPanelState() {
  return { zoom: 1, panX: 0, panY: 0, dragging: false,
           dragStartX: 0, dragStartY: 0, panStartX: 0, panStartY: 0,
           natW: 1, natH: 1 };
}

function applyPanelWidths() {
  var container = document.getElementById("panels");
  var totalW = container.clientWidth - 16;
  var panels = container.querySelectorAll(".panel");
  panels.forEach(function(p, i) { p.style.width = (totalW * panelWidths[i]) + "px"; });
  ["a", "b", "c"].forEach(updateImageTransform);
}

function buildPanels() {
  var container = document.getElementById("panels");
  container.innerHTML = "";
  var letters = ["a", "b", "c"];

  letters.forEach(function(letter, idx) {
    panelState[letter] = createPanelState();
    var panel = document.createElement("div");
    panel.className = "panel"; panel.id = "panel-" + letter;

    var header = document.createElement("div");
    header.className = "panel-header";
    header.innerHTML =
      '<div><span class="panel-label">' + letter.toUpperCase() + '</span>' +
      '<span class="panel-code" id="code-' + letter + '">&mdash;</span></div>' +
      '<div class="zoom-controls">' +
      '<button class="zoom-btn" onclick="zoomOut(\'' + letter + '\')">&minus;</button>' +
      '<button class="zoom-btn" onclick="resetView(\'' + letter + '\')" style="font-size:10px">&#8857;</button>' +
      '<button class="zoom-btn" onclick="zoomIn(\'' + letter + '\')">+</button></div>';

    var viewport = document.createElement("div");
    viewport.className = "viewport"; viewport.id = "viewport-" + letter;

    var img = document.createElement("img");
    img.id = "img-" + letter; img.alt = "Document " + letter.toUpperCase(); img.draggable = false;
    img.onload = function() {
      panelState[letter].natW = this.naturalWidth;
      panelState[letter].natH = this.naturalHeight;
      updateImageTransform(letter);
      var err = document.getElementById("err-" + letter); if (err) err.remove();
    };
    img.onerror = function() {
      var vp = document.getElementById("viewport-" + letter);
      if (!document.getElementById("err-" + letter)) {
        var err = document.createElement("div"); err.className = "img-error";
        err.id = "err-" + letter; err.textContent = "Image failed to load"; vp.appendChild(err);
      }
    };

    var indicator = document.createElement("div");
    indicator.className = "zoom-indicator"; indicator.id = "zoom-" + letter; indicator.textContent = "100%";
    viewport.appendChild(img); viewport.appendChild(indicator);

    viewport.addEventListener("mousedown", function(e) {
      if (e.button !== 0) return; e.preventDefault();
      var s = panelState[letter]; s.dragging = true;
      s.dragStartX = e.clientX; s.dragStartY = e.clientY;
      s.panStartX = s.panX; s.panStartY = s.panY;
      viewport.classList.add("dragging");
    });
    viewport.addEventListener("wheel", function(e) {
      e.preventDefault(); var s = panelState[letter];
      s.zoom = Math.max(0.3, Math.min(10, s.zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
      updateImageTransform(letter);
    }, { passive: false });

    var touchRef = { x:0, y:0, panX:0, panY:0, active:false };
    viewport.addEventListener("touchstart", function(e) {
      if (e.touches.length === 1) { var t = e.touches[0]; var s = panelState[letter];
        touchRef = { x:t.clientX, y:t.clientY, panX:s.panX, panY:s.panY, active:true }; }
    }, { passive: true });
    viewport.addEventListener("touchmove", function(e) {
      if (e.touches.length === 1 && touchRef.active) { e.preventDefault();
        var t = e.touches[0]; var s = panelState[letter];
        s.panX = touchRef.panX + (t.clientX - touchRef.x);
        s.panY = touchRef.panY + (t.clientY - touchRef.y);
        updateImageTransform(letter); }
    }, { passive: false });
    viewport.addEventListener("touchend", function() { touchRef.active = false; });

    panel.appendChild(header); panel.appendChild(viewport); container.appendChild(panel);

    if (idx < 2) {
      var divider = document.createElement("div");
      divider.className = "divider"; divider.dataset.index = String(idx);
      container.appendChild(divider);
    }
  });

  // Divider drag
  var activeDivider = null, dividerStartX = 0, startWidths = [0,0,0];
  container.addEventListener("mousedown", function(e) {
    if (!e.target.classList.contains("divider")) return;
    e.preventDefault(); activeDivider = parseInt(e.target.dataset.index);
    dividerStartX = e.clientX; var totalW = container.clientWidth - 16;
    startWidths = panelWidths.map(function(w) { return w * totalW; });
    e.target.classList.add("active");
    document.body.style.cursor = "col-resize"; document.body.style.userSelect = "none";
  });
  document.addEventListener("mousemove", function(e) {
    if (activeDivider === null) return;
    var dx = e.clientX - dividerStartX; var totalW = container.clientWidth - 16;
    var newL = Math.max(80, Math.min(startWidths[activeDivider] + dx, totalW - 80));
    var newR = Math.max(80, Math.min(startWidths[activeDivider + 1] - dx, totalW - 80));
    panelWidths[activeDivider] = newL / totalW;
    panelWidths[activeDivider + 1] = newR / totalW;
    var sum = panelWidths[0] + panelWidths[1] + panelWidths[2];
    panelWidths = panelWidths.map(function(w) { return w / sum; });
    applyPanelWidths();
  });
  document.addEventListener("mouseup", function() {
    if (activeDivider !== null) {
      container.querySelectorAll(".divider").forEach(function(d) { d.classList.remove("active"); });
      activeDivider = null; document.body.style.cursor = ""; document.body.style.userSelect = "";
    }
    ["a","b","c"].forEach(function(l) {
      panelState[l].dragging = false;
      var vp = document.getElementById("viewport-" + l); if (vp) vp.classList.remove("dragging");
    });
  });
  document.addEventListener("mousemove", function(e) {
    ["a","b","c"].forEach(function(l) {
      var s = panelState[l]; if (!s.dragging) return;
      s.panX = s.panStartX + (e.clientX - s.dragStartX);
      s.panY = s.panStartY + (e.clientY - s.dragStartY);
      updateImageTransform(l);
    });
  });
  applyPanelWidths();
}

function updateImageTransform(letter) {
  var s = panelState[letter];
  var img = document.getElementById("img-" + letter);
  var viewport = document.getElementById("viewport-" + letter);
  var indicator = document.getElementById("zoom-" + letter);
  if (!img || !viewport) return;
  var vpH = viewport.clientHeight, aspect = s.natW / s.natH;
  var dH = vpH * s.zoom, dW = dH * aspect;
  img.style.width = dW + "px"; img.style.height = dH + "px";
  img.style.transform = "translate(" + s.panX + "px, " + s.panY + "px)";
  if (indicator) indicator.textContent = Math.round(s.zoom * 100) + "%";
}

function loadTriplet(idx) {
  currentIndex = idx; var t = TRIPLETS[idx]; if (!t) return;
  ["a","b","c"].forEach(function(l) {
    var img = document.getElementById("img-" + l);
    var code = document.getElementById("code-" + l);
    var err = document.getElementById("err-" + l); if (err) err.remove();
    if (img) img.src = BASE_URL + "/" + t[l].file;
    if (code) code.textContent = t[l].code;
    var s = panelState[l]; s.zoom = 1; s.panX = 0; s.panY = 0;
    updateImageTransform(l);
  });
  document.getElementById("counter").textContent = (idx+1) + " / " + TRIPLETS.length;
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === TRIPLETS.length - 1;
  document.getElementById("progressFill").style.width = ((idx+1) / TRIPLETS.length * 100) + "%";
}

function goNext() { if (currentIndex < TRIPLETS.length - 1) loadTriplet(currentIndex + 1); }
function goPrev() { if (currentIndex > 0) loadTriplet(currentIndex - 1); }
function zoomIn(l) { panelState[l].zoom = Math.min(10, panelState[l].zoom * 1.3); updateImageTransform(l); }
function zoomOut(l) { panelState[l].zoom = Math.max(0.3, panelState[l].zoom / 1.3); updateImageTransform(l); }
function resetView(l) { panelState[l].zoom = 1; panelState[l].panX = 0; panelState[l].panY = 0; updateImageTransform(l); }

document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowRight") { e.preventDefault(); goNext(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
});
window.addEventListener("resize", applyPanelWidths);

buildPanels();
loadTriplet(0);
</script>
</body>
</html>
