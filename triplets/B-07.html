function updateImageTransform(l) { var s=panelState[l]; var im=document.getElementById("img-"+l); var vp=document.getElementById("viewport-"+l); var ind=document.getElementById("zoom-"+l); if(!im||!vp)return; var h=vp.clientHeight*s.zoom; var w=h*(s.natW/s.natH); im.style.width=w+"px"; im.style.height=h+"px"; im.style.transform="translate("+s.panX+"px,"+s.panY+"px)"; if(ind)ind.textContent=Math.round(s.zoom*100)+"%"; }
function loadTriplet(i) { currentIndex=i; var t=TRIPLETS[i]; if(!t)return; ["a","b","c"].forEach(function(l){ var im=document.getElementById("img-"+l); var co=document.getElementById("code-"+l); var er=document.getElementById("err-"+l); if(er)er.remove(); if(im)im.src=BASE_URL+"/"+t[l].file; if(co)co.textContent=t[l].code; var s=panelState[l]; s.zoom=1; s.panX=0; s.panY=0; updateImageTransform(l); }); document.getElementById("counter").textContent=(i+1)+" / "+TRIPLETS.length; document.getElementById("prevBtn").disabled=i===0; document.getElementById("nextBtn").disabled=i===TRIPLETS.length-1; document.getElementById("progressFill").style.width=((i+1)/TRIPLETS.length*100)+"%"; }
