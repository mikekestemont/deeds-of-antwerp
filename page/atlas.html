<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Atlas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }

  #hover-panel {
    display: none;
    position: fixed;
    pointer-events: none;
    z-index: 100;
    background: #1a1a22;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #hover-panel img {
    display: block;
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 3px;
  }
  #hover-label {
    font-size: 11px;
    color: #999;
    padding: 4px 2px 2px;
    text-align: center;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 12px;
    cursor: zoom-out;
  }
  #lightbox.active { display: flex; }

  #lightbox-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    cursor: default;
  }

  #lightbox img {
    max-width: 85vw;
    max-height: 75vh;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }

  #lightbox-caption {
    font-size: 13px;
    color: #ccc;
    max-width: 600px;
    text-align: center;
  }

  #lightbox-link {
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    padding: 8px 12px;
    border: 1px solid #555;
    border-radius: 6px;
    background: #1a1a22;
  }

  #lightbox-link:hover {
    background: #2a2a36;
  }

  #info {
    position: fixed;
    bottom: 16px;
    right: 16px;
    font-size: 11px;
    color: #aaa;
    z-index: 50;
  }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 20000;
    background: #0a0a0f;
    font-size: 14px;
    color: #999;
    transition: opacity 0.4s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="loading">loading…</div>
<canvas id="canvas"></canvas>

<div id="hover-panel">
  <img id="hover-img" src="" alt="">
  <div id="hover-label"></div>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <div id="lightbox-content" onclick="event.stopPropagation()">
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-caption"></div>
    <a id="lightbox-link" href="#" target="_blank" rel="noopener noreferrer">Go to transcription</a>
  </div>
</div>

<div id="info"></div>

<script src="https://cdn.jsdelivr.net/npm/d3-dispatch@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-selection@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-transition@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-zoom@3"></script>
<script>
/**
 * CONFIG — adjust to taste
 */
const CONFIG = {
  dataFile:   'data.json',
  logoFile:   'logo.png',
  markerSize: 24,
  gridColor:  '#e0dfdc',
  gridWidth:  0.5,
};

/* ── Canvas ──────────────────────────────────────────── */
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = W * dpr;
  cvs.height = H * dpr;
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
}
window.addEventListener('resize', () => { resize(); draw(); });
resize();

/* ── State ───────────────────────────────────────────── */
let data = [];
let transform = d3.zoomIdentity;
let logoImg = null;
let hoveredIndex = -1;

let baseScale = 1, baseOffX = 0, baseOffY = 0;

function initBaseTransform() {
  if (!data.length) return;
  const pad = 80;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const d of data) {
    if (d.x < minX) minX = d.x;
    if (d.x > maxX) maxX = d.x;
    if (d.y < minY) minY = d.y;
    if (d.y > maxY) maxY = d.y;
  }
  const rangeX = maxX - minX || 1;
  const rangeY = maxY - minY || 1;
  baseScale = Math.min((W - pad * 2) / rangeX, (H - pad * 2) / rangeY);
  baseOffX = (W - rangeX * baseScale) / 2 - minX * baseScale;
  baseOffY = (H - rangeY * baseScale) / 2 - minY * baseScale;
}

function toScreen(dx, dy) {
  return [dx * baseScale + baseOffX, dy * baseScale + baseOffY];
}

function toData(sx, sy) {
  const [ux, uy] = transform.invert([sx, sy]);
  return [(ux - baseOffX) / baseScale, (uy - baseOffY) / baseScale];
}

/* ── Drawing ─────────────────────────────────────────── */
function draw() {
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.k, transform.k);

  const s = CONFIG.markerSize / transform.k;
  const half = s / 2;
  const logoReady = logoImg && logoImg.complete && logoImg.naturalWidth > 0;

  for (let i = 0; i < data.length; i++) {
    const d = data[i];
    const [sx, sy] = toScreen(d.x, d.y);
    const isHovered = (i === hoveredIndex);
    const sz = isHovered ? s * 1.8 : s;
    const hz = sz / 2;

    if (logoReady) {
      ctx.globalAlpha = isHovered ? 1.0 : 0.85;
      ctx.drawImage(logoImg, sx - hz, sy - hz, sz, sz);
      ctx.globalAlpha = 1.0;
    } else {
      ctx.beginPath();
      ctx.arc(sx, sy, hz * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = isHovered ? '#fff' : '#aaa';
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawGrid() {
  if (!data.length) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const d of data) {
    if (d.x < minX) minX = d.x;
    if (d.x > maxX) maxX = d.x;
    if (d.y < minY) minY = d.y;
    if (d.y > maxY) maxY = d.y;
  }
  const range = Math.max(maxX - minX, maxY - minY);
  const rawStep = Math.pow(10, Math.floor(Math.log10(range)));
  const gridStep = rawStep > 2 ? rawStep / 2 : rawStep;

  ctx.strokeStyle = CONFIG.gridColor;
  ctx.lineWidth = CONFIG.gridWidth / transform.k;

  const x0 = Math.floor((minX - gridStep) / gridStep) * gridStep;
  const x1 = Math.ceil((maxX + gridStep) / gridStep) * gridStep;
  const y0 = Math.floor((minY - gridStep) / gridStep) * gridStep;
  const y1 = Math.ceil((maxY + gridStep) / gridStep) * gridStep;

  for (let gx = x0; gx <= x1; gx += gridStep) {
    const [sx] = toScreen(gx, 0);
    const [, syA] = toScreen(0, y0);
    const [, syB] = toScreen(0, y1);
    ctx.beginPath(); ctx.moveTo(sx, syA); ctx.lineTo(sx, syB); ctx.stroke();
  }
  for (let gy = y0; gy <= y1; gy += gridStep) {
    const [, sy] = toScreen(0, gy);
    const [sxA] = toScreen(x0, 0);
    const [sxB] = toScreen(x1, 0);
    ctx.beginPath(); ctx.moveTo(sxA, sy); ctx.lineTo(sxB, sy); ctx.stroke();
  }
}

/* ── Zoom + Pan ──────────────────────────────────────── */
const zoom = d3.zoom()
  .scaleExtent([0.3, 50])
  .filter((e) => {
    if (e.type === 'wheel') return false;
    return !e.button;
  })
  .on('zoom', (e) => { transform = e.transform; draw(); });

const sel = d3.select(cvs);
sel.call(zoom);

cvs.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const scale = Math.pow(2, -e.deltaY * 0.01);
    sel.call(zoom.scaleBy, scale, [e.clientX, e.clientY]);
  } else {
    sel.call(zoom.translateBy, -e.deltaX / transform.k, -e.deltaY / transform.k);
  }
}, { passive: false });

/* ── Hover ───────────────────────────────────────────── */
const hoverPanel = document.getElementById('hover-panel');
const hoverImg   = document.getElementById('hover-img');
const hoverLabel = document.getElementById('hover-label');

function findNearest(mx, my) {
  const [dx, dy] = toData(mx, my);
  const hitR = (CONFIG.markerSize * 0.8) / (baseScale * transform.k);
  let best = -1, bestDist = Infinity;
  for (let i = 0; i < data.length; i++) {
    const ex = data[i].x - dx, ey = data[i].y - dy;
    const dist = Math.sqrt(ex * ex + ey * ey);
    if (dist < hitR && dist < bestDist) { bestDist = dist; best = i; }
  }
  return best;
}

cvs.addEventListener('mousemove', (e) => {
  const idx = findNearest(e.clientX, e.clientY);
  if (idx !== hoveredIndex) { hoveredIndex = idx; draw(); }
  if (idx >= 0) {
    const d = data[idx];
    hoverImg.src = d.full || d.src;
    hoverLabel.textContent = d.label || d.src.split('/').pop();
    hoverPanel.style.display = 'block';
    let px = e.clientX + 20, py = e.clientY - 100;
    if (px + 200 > W) px = e.clientX - 200;
    if (py < 10) py = 10;
    hoverPanel.style.left = px + 'px';
    hoverPanel.style.top  = py + 'px';
  } else {
    hoverPanel.style.display = 'none';
  }
});

cvs.addEventListener('mouseleave', () => {
  hoveredIndex = -1;
  hoverPanel.style.display = 'none';
  draw();
});

/* ── Click → lightbox ────────────────────────────────── */
let mouseDown = [0, 0];
cvs.addEventListener('mousedown', (e) => { mouseDown = [e.clientX, e.clientY]; });
cvs.addEventListener('mouseup', (e) => {
  const dx = e.clientX - mouseDown[0], dy = e.clientY - mouseDown[1];
  if (dx * dx + dy * dy > 25) return;
  const idx = findNearest(e.clientX, e.clientY);
  if (idx >= 0) openLightbox(data[idx]);
});

function openLightbox(d) {
  document.getElementById('lightbox-img').src = d.full || d.src;
  document.getElementById('lightbox-caption').textContent = d.label || d.src.split('/').pop();

  const link = document.getElementById('lightbox-link');
  if (d.url) {
    link.href = d.url;
    link.style.display = 'inline-block';
  } else {
    link.style.display = 'none';
  }

  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

/* ── Load ─────────────────────────────────────────────── */
logoImg = new Image();
logoImg.src = CONFIG.logoFile;

Promise.all([
  fetch(CONFIG.dataFile).then(r => r.json()),
  new Promise(res => { logoImg.onload = res; logoImg.onerror = res; })
]).then(([json]) => {
  data = json;
  initBaseTransform();
  document.getElementById('info').textContent = data.length + ' images';
  document.getElementById('loading').classList.add('done');
  draw();
}).catch(err => {
  console.error(err);
  document.getElementById('loading').textContent = 'Error loading data — check console';
});
</script>
</body>
</html>
